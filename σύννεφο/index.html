<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athena AI — Plataforma de Video Profesional</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #000000; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; border-top: 3px solid #fbbf24; }

        /* Encabezado Superior */
        header { height: 60px; background: #0a0a0a; border-bottom: 1px solid #1f1f1f; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .logo { font-size: 1.15rem; font-weight: bold; color: #fbbf24; display: flex; align-items: center; gap: 10px; letter-spacing: 0.5px; }
        .logo span { background: rgba(251, 191, 36, 0.12); color: #fbbf24; font-size: 0.72rem; padding: 3px 9px; border-radius: 4px; border: 1px solid rgba(251, 191, 36, 0.35); }

        .header-right { display: flex; align-items: center; gap: 12px; }
        .user-email-box { display: flex; align-items: center; gap: 6px; background: #141414; border: 1px solid #262626; padding: 5px 10px; border-radius: 6px; }
        .user-email-box input { background: transparent; border: none; color: #fbbf24; font-size: 0.8rem; width: 190px; outline: none; }
        
        .balance-badge { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.35); color: #34d399; padding: 5px 11px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }

        .btn-save { background: #fbbf24; color: #000000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-save:hover { background: #f59e0b; }
        .btn-save:disabled { background: #262626; color: #666666; cursor: not-allowed; }

        /* Escenario Central 16:9 */
        .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px; position: relative; background: radial-gradient(circle at center, #120f05 0%, #000000 75%); }
        
        .video-frame { width: 100%; max-width: 850px; aspect-ratio: 16 / 9; background: #030303; border: 2px solid #262626; border-radius: 12px; position: relative; overflow: hidden; box-shadow: 0 20px 55px rgba(0, 0, 0, 0.95), 0 0 30px rgba(251, 191, 36, 0.1); display: flex; align-items: center; justify-content: center; }
        .video-frame.active { border-color: #fbbf24; }

        canvas#videoCanvas { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }

        .status-badge { position: absolute; top: 14px; left: 14px; background: rgba(0, 0, 0, 0.88); border: 1px solid #fbbf24; color: #fbbf24; padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: bold; display: flex; align-items: center; gap: 8px; z-index: 10; }
        .rec-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; display: none; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Barra Inferior de Comando */
        .prompt-dock { background: #0a0a0a; border-top: 1px solid #1f1f1f; padding: 14px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .prompt-box { width: 100%; max-width: 850px; display: flex; gap: 10px; background: #121212; border: 1px solid #333333; padding: 8px; border-radius: 10px; transition: border-color 0.2s; flex-wrap: wrap; }
        .prompt-box:focus-within { border-color: #fbbf24; }

        .mode-select { background: #000000; color: #fbbf24; border: 1px solid #404040; padding: 8px 12px; border-radius: 7px; font-size: 0.85rem; font-weight: bold; outline: none; cursor: pointer; }

        .prompt-box input { flex: 1; min-width: 220px; background: transparent; border: none; color: #ffffff; font-size: 0.95rem; padding: 8px 10px; outline: none; }
        .prompt-box input::placeholder { color: #666666; }

        .btn-generate { background: #fbbf24; color: #000000; border: none; padding: 10px 22px; border-radius: 7px; font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: transform 0.15s, background 0.2s; white-space: nowrap; }
        .btn-generate:hover { background: #f59e0b; transform: scale(1.02); }
        .btn-generate:disabled { background: #333333; color: #777777; cursor: not-allowed; transform: none; }

        .footer-note { font-size: 0.75rem; color: #737373; text-align: center; }
        .footer-note a { color: #fbbf24; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🦉 Athena AI <span>Plataforma Pro</span></div>
        <div class="header-right">
            <div class="user-email-box" title="Cuenta en athena-db">
                <span style="font-size:0.8rem;">👤</span>
                <input type="email" id="userEmail" value="admin@genesis-ai.org" placeholder="Tu correo..." />
            </div>
            <div class="balance-badge" id="balanceDisplay">Saldo: $5.00</div>
            <button class="btn-save" id="saveBtn" onclick="guardarVideo()" disabled>💾 Guardar Video PC / USB</button>
        </div>
    </header>

    <main class="stage">
        <div class="video-frame" id="videoFrame">
            <div class="status-badge">
                <span class="rec-dot" id="recDot"></span>
                <span id="statusText">Athena AI lista — Escribe tu prompt y genera tu video</span>
            </div>
            <canvas id="videoCanvas" width="1280" height="720"></canvas>
        </div>
    </main>

    <footer class="prompt-dock">
        <div class="prompt-box">
            <select id="modeSelect" class="mode-select">
                <option value="free" selected>⚡ Modo Cinemático (Gratis)</option>
                <option value="pro">🏛️ Modo Pro IA ($0.55 USD)</option>
            </select>
            <input type="text" id="promptInput" placeholder="Describe tu escena: Ej. Cinematic Athena in space..." />
            <button class="btn-generate" id="genBtn" onclick="iniciarCreacion()">✨ Crear Video</button>
        </div>
        <div class="footer-note">
            Ecosistema <a href="https://genesis-ai.org" target="_blank">Genesis AI</a> • Soporte y recargas: <a href="mailto:admin@genesis-ai.org">admin@genesis-ai.org</a>
        </div>
    </footer>

    <script>
        const WORKER_API_URL = "https://athena-video-api.genesis-ia.workers.dev/";

        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const promptInput = document.getElementById('promptInput');
        const modeSelect = document.getElementById('modeSelect');
        const userEmailInput = document.getElementById('userEmail');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const genBtn = document.getElementById('genBtn');
        const saveBtn = document.getElementById('saveBtn');
        const statusText = document.getElementById('statusText');
        const recDot = document.getElementById('recDot');
        const videoFrame = document.getElementById('videoFrame');

        let animId = null;
        let currentDownloadUrl = null;
        let currentFileName = "athena_ai_video.webm";

        function dibujarTemploInicial() {
            ctx.fillStyle = '#030303';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(251, 191, 36, 0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 36px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText('ATHENA AI — ESTUDIO DE VIDEO', canvas.width / 2, canvas.height / 2 - 15);

            ctx.fillStyle = '#a3a3a3';
            ctx.font = '18px Segoe UI, sans-serif';
            ctx.fillText('Escribe tu visión abajo y genera tu video de alta calidad', canvas.width / 2, canvas.height / 2 + 25);
        }
        dibujarTemploInicial();

        async function iniciarCreacion() {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                alert("Por favor escribe una descripción para la escena.");
                return;
            }

            const modo = modeSelect.value;
            
            if (modo === "pro") {
                // 1. Validar y descontar saldo a través del Worker (worker.js)
                genBtn.disabled = true;
                statusText.textContent = "🏛️ Conectando con worker.js ($0.55 USD)... Validando base de datos...";
                recDot.style.display = "inline-block";
                videoFrame.classList.add('active');

                try {
                    const response = await fetch(WORKER_API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            email: userEmailInput.value.trim() || "admin@genesis-ai.org",
                            prompt: prompt
                        })
                    });

                    const data = await response.json();

                    if (!response.ok || !data.success) {
                        recDot.style.display = "none";
                        statusText.textContent = "⚠️ " + (data.error || "Error al procesar saldo");
                        dibujarTemploInicial();
                        genBtn.disabled = false;
                        alert(data.error || "Saldo insuficiente o error en base de datos.");
                        return;
                    }

                    // Actualizar saldo en la esquina superior
                    if (data.nuevoSaldo !== undefined) {
                        balanceDisplay.textContent = `Saldo: $${data.nuevoSaldo.toFixed(2)}`;
                    }

                    statusText.textContent = "✅ Saldo descontado ($0.55) — Renderizando video Pro extendido...";
                } catch (error) {
                    recDot.style.display = "none";
                    statusText.textContent = "❌ Error de conexión con el Worker";
                    genBtn.disabled = false;
                    alert("Error de red: " + error.message);
                    return;
                }
            }

            // 2. Renderizar video fluido de larga duración directamente en el navegador
            renderizarVideoFluido(prompt, modo === "pro" ? "ATHENA PRO (IA)" : "ATHENA MODO LIBRE");
        }

        function renderizarVideoFluido(prompt, tituloModo) {
            if (animId) cancelAnimationFrame(animId);
            saveBtn.disabled = true;
            genBtn.disabled = true;
            videoFrame.classList.add('active');
            recDot.style.display = "inline-block";
            statusText.textContent = "⚡ Renderizando video fluido en alta definición (10 segundos)...";

            const estrellas = Array.from({ length: 150 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 2.2 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 1.5 + 0.5
            }));

            const stream = canvas.captureStream(30);
            const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
            const chunks = [];

            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                currentDownloadUrl = URL.createObjectURL(blob);
                currentFileName = "athena_video_pro.webm";
                recDot.style.display = "none";
                statusText.textContent = "✅ ¡Video Pro generado con éxito! Listo para guardar en PC o USB";
                saveBtn.disabled = false;
                genBtn.disabled = false;
            };

            mediaRecorder.start();
            let frame = 0;
            const totalFrames = 300; // 10 segundos completos a 30fps

            function animar() {
                frame++;
                ctx.fillStyle = '#010103';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Movimiento estelar de fondo
                estrellas.forEach(s => {
                    s.x -= s.speed;
                    if (s.x < 0) s.x = canvas.width;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.8 + 0.2})`;
                    ctx.fill();
                });

                // Anillo central cinemático en expansión
                const radioPulso = Math.sin(frame * 0.03) * 35 + 160;
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, radioPulso, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.7)';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Marco dorado central
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.25)';
                ctx.lineWidth = 2;
                ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);

                // Texto del prompt en pantalla
                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 30px Georgia, serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 15;
                
                // Mostrar prompt con efecto dinámico
                const textoMostrar = prompt.length > 55 ? prompt.substring(0, 52) + "..." : prompt;
                ctx.fillText(textoMostrar.toUpperCase(), canvas.width / 2, canvas.height / 2 + 10);

                ctx.fillStyle = '#fbbf24';
                ctx.font = '13px Courier New, monospace';
                ctx.fillText(`${tituloModo} • PROGRESO: ${Math.round((frame / totalFrames) * 100)}%`, canvas.width / 2, canvas.height - 45);
                ctx.restore();

                if (frame < totalFrames) {
                    animId = requestAnimationFrame(animar);
                } else {
                    mediaRecorder.stop();
                }
            }
            animar();
        }

        async function guardarVideo() {
            if (!currentDownloadUrl) return;
            try {
                const a = document.createElement('a');
                a.href = currentDownloadUrl;
                a.download = currentFileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (e) {
                window.open(currentDownloadUrl, '_blank');
            }
        }

        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') iniciarCreacion();
        });
    </script>
</body>
</html>
